<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora MTTR e Downtime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>Calculadora MTTR e Downtime</h2>

    <label>Tempo Total do Incidente</label>
    <input
        type="text"
        id="tempo"
        placeholder="Ex: 01:35:20 ou 01:35"
    >

    <label>Sintoma</label>
    <select id="sintoma">
        <option value="1">Indisponibilidade Total</option>
        <option value="0.6">Degradação</option>
        <option value="0.3">Lentidão</option>
    </select>

    <button onclick="calcular()">Calcular</button>

    <div class="resultado" id="resultado">
        <p><strong>MTTR:</strong> <span id="mttr"></span></p>
        <p><strong>Classificação:</strong> <span id="classificacao"></span></p>
        <p><strong>Downtime:</strong> <span id="downtime"></span></p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>

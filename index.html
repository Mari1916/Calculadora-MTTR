<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora MTTR e Downtime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>Calculadora MTTR e Downtime</h2>

    <div class="linha-horas">
        <div class="campo">
            <label for="horaInicio">Hora Início</label>
            <input type="time" id="horaInicio">
        </div>

        <div class="campo">
            <label for="horaFim">Hora Fim</label>
            <input type="time" id="horaFim">
        </div>
    </div>

    <label for="sintoma">Sintoma</label>
    <select id="sintoma">
        <option value="1">Indisponibilidade Total</option>
        <option value="0.6">Degradação</option>
        <option value="0.3">Lentidão</option>
    </select>

    <button type="button" onclick="calcular()">
        Calcular
    </button>

    <div class="resultado" id="resultado">

        <p>
            <strong>Minutos de Indisponibilidade:</strong>
            <span id="minutos"></span>
        </p>

        <p>
            <strong>MTTR:</strong>
            <span id="mttr"></span>
        </p>

        <p>
            <strong>Classificação:</strong>
            <span id="classificacao"></span>
        </p>

        <p>
            <strong>Downtime:</strong>
            <span id="downtime"></span>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>

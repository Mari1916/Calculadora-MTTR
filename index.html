<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora MTTR e Downtime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>Calculadora MTTR e Downtime</h2>

    <label class="checkbox-container">
        <input
            type="checkbox"
            id="diasDiferentes"
            onchange="toggleDatas()"
        >
        Incidente ocorreu em dias diferentes
    </label>

    <div id="camposData" class="campos-data">

        <div class="linha-horas">

            <div class="campo">
                <label>Data Início</label>
                <input type="date" id="dataInicio">
            </div>

            <div class="campo">
                <label>Data Fim</label>
                <input type="date" id="dataFim">
            </div>

        </div>

    </div>

    <div class="linha-horas">

        <div class="campo">
            <label>Hora Início</label>
            <input type="time" id="horaInicio">
        </div>

        <div class="campo">
            <label>Hora Fim</label>
            <input type="time" id="horaFim">
        </div>

    </div>

    <label>Sintoma</label>

    <select id="sintoma">
        <option value="1">Indisponibilidade Total</option>
        <option value="0.6">Degradação</option>
        <option value="0.3">Lentidão</option>
    </select>

    <button onclick="calcular()">
        Calcular
    </button>

    <div class="resultado" id="resultado">

        <p>
            <strong>Minutos de Indisponibilidade:</strong>
            <span id="minutos"></span>
        </p>

        <p>
            <strong>MTTR:</strong>
            <span id="mttr"></span>
        </p>

        <p>
            <strong>Classificação:</strong>
            <span id="classificacao"></span>
        </p>

        <p>
            <strong>Downtime:</strong>
            <span id="downtime"></span>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
